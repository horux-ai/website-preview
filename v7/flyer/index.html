<style>
  /* the flyer's own ground, so the page and the image read as one sheet */
  html { background: #0a0e17; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #0a0e17; }
  main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 20px; }
  img { display: block; width: min(100%, 1280px); height: auto; }
  /* on a wide screen the whole flyer and the button fit the window without scrolling */
  @media (min-aspect-ratio: 4 / 5) { img { width: auto; max-width: 100%; height: calc(100vh - 92px); height: calc(100svh - 92px); } }
  /* the booking button, in the flyer's blue; on a phone it stays at the foot of the screen while the flyer scrolls */
  .book {
    position: sticky; bottom: 16px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; border-radius: 999px;
    background: #33b8ef; color: #0a0e17; text-decoration: none;
    font: 700 18px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    box-shadow: 0 8px 28px rgb(0 0 0 / .45);
    transition: background-color .15s ease, transform .15s ease;
  }
  .book:hover { background: #5cc8f3; }
  .book:active { transform: scale(.98); }
  .book:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .book svg { width: 20px; height: 20px; flex: none; }
